[project]
name = "tinyforge-vision"
version = "0.1.0"
description = "A small VLM (SigLIP-B/16 + SmolLM2-135M) reproducing nanoVLM v0.1."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy",
    "pillow",
    "datasets>=3.0",
    "huggingface-hub",
    "transformers>=4.46,<5", # <5: MMStarCollator calls tokenizer.batch_encode_plus(padding_side=...)
    "safetensors",
    "pyarrow",
    "requests",
    "wandb",
    "tqdm",
]

[dependency-groups]
dev = ["pytest", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tfv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: downloads checkpoints or datasets from the HF Hub (deselect with -m 'not slow')"]
